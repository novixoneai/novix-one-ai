name: Deploy to Zo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run type-check || true

      - name: Build
        run: bun run build

      - name: Notify Zo of deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "✅ Build successful!"
          echo "Zo is rebuilding your site automatically..."
