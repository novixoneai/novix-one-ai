<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Jorge Socorro — Novix One</title>
<meta name="description" content="Jorge Socorro, Founder & AI Consultant at Novix One. Tap to view contact details, save to your phone, or share.">

<!-- iOS / Android app-like behavior -->
<meta name="theme-color" content="#16224a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jorge Socorro">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="favicon-180.png">

<!-- Link preview when shared via WhatsApp / iMessage / SMS -->
<meta property="og:type" content="profile">
<meta property="og:title" content="Jorge Socorro — Novix One">
<meta property="og:description" content="Founder & AI Consultant · AI. Automated. Elevated. Tap to save my contact or get in touch.">
<meta property="og:image" content="card-front.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Jorge Socorro — Novix One">
<meta name="twitter:image" content="card-front.png">

<style>
  :root{
    --navy: #16224a;
    --navy-deep: #0e1730;
    --blue: #3e5fe0;
    --blue-soft: #6f8cf0;
    --gray: #6b7280;
    --bg-top: #eef1fb;
    --bg-bottom: #dfe4f5;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background: radial-gradient(circle at 50% 0%, var(--bg-top), var(--bg-bottom) 75%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .page{
    min-height:100vh;
    min-height: 100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom));
    gap: clamp(16px, 4vh, 24px);
  }

  .eyebrow{
    font-size: clamp(9.5px, 2.6vw, 10.5px);
    letter-spacing:0.12em;
    text-transform:uppercase;
    color: rgba(107,114,128,0.6);
    font-weight:500;
    display:flex;
    align-items:center;
    gap:7px;
  }

  .eyebrow .dot{
    width:5px;height:5px;border-radius:50%;
    background: rgba(62,95,224,0.55);
    display:inline-block;
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.35; transform:scale(0.7); }
  }

  /* ---------- Card ---------- */

  .stage{
    perspective: 2400px;
    -webkit-perspective: 2400px;
    width: min(88vw, calc(68vh * 1.75), 480px);
    aspect-ratio: 1.75 / 1;
    cursor: pointer;
    user-select: none;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(22,34,74,0.28), 0 3px 8px rgba(22,34,74,0.15);
    flex-shrink: 0;
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(.22,.9,.32,1.06);
  }

  .stage.flipped .card{
    transform: rotateY(180deg);
  }

  .face{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius: 18px;
    overflow:hidden;
    background-size: cover;
    background-position:center;
    background-repeat:no-repeat;
    border: 1px solid rgba(255,255,255,0.5);
  }

  .face.front{ background-image: url("card-front.png"); }
  .face.back{
    background-image: url("card-back.png");
    transform: rotateY(180deg);
  }

  .flip-hint{
    position:absolute;
    bottom:10px;
    right:14px;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: rgba(255,255,255,0.9);
    background: rgba(22,34,74,0.55);
    backdrop-filter: blur(4px);
    padding: 4px 9px;
    border-radius: 20px;
    display:flex;
    align-items:center;
    gap:5px;
    pointer-events:none;
    opacity:0.85;
  }

  .flip-hint svg{ width:11px; height:11px; }

  /* ---------- Actions ---------- */

  .actions{
    width: min(88vw, calc(68vh * 1.75), 480px);
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:10px;
  }

  .actions .full{ grid-column: 1 / -1; }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding: 13px 14px;
    border-radius: 12px;
    border: none;
    font-size: clamp(13.5px, 3.6vw, 14.5px);
    font-weight: 600;
    font-family: inherit;
    cursor:pointer;
    text-decoration:none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }

  .btn svg{ width:17px; height:17px; flex-shrink:0; }

  .btn:active{ transform: scale(0.97); }

  .btn-primary{
    background: linear-gradient(135deg, var(--blue), #2f4bd1);
    color:#fff;
    box-shadow: 0 8px 20px rgba(62,95,224,0.35);
  }

  .btn-secondary{
    background: #fff;
    color: var(--navy);
    box-shadow: 0 4px 14px rgba(22,34,74,0.12);
    border: 1px solid rgba(22,34,74,0.08);
  }

  .btn-ghost{
    background: rgba(255,255,255,0.6);
    color: var(--navy);
    border: 1px solid rgba(22,34,74,0.1);
  }

  .btn-quiet{
    background: rgba(62,95,224,0.09);
    color: #2f4bd1;
    border: 1px solid rgba(62,95,224,0.16);
    font-weight: 600;
    box-shadow: none;
  }

  .btn-quiet:active{
    background: rgba(62,95,224,0.14);
  }

  .btn-text{
    background: transparent;
    color: var(--gray);
    font-weight: 500;
    font-size: 13px;
    padding: 8px 10px;
    box-shadow: none;
  }

  .toast{
    position:fixed;
    bottom: calc(24px + env(safe-area-inset-bottom));
    left:50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--navy-deep);
    color:#fff;
    padding: 11px 18px;
    border-radius: 30px;
    font-size:13px;
    font-weight:500;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    white-space:nowrap;
    max-width: 90vw;
    text-align:center;
  }

  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  .footnote{
    max-width: min(88vw, 480px);
    text-align:center;
    font-size: clamp(11px, 3vw, 12px);
    color: var(--gray);
    line-height:1.5;
  }

  /* ---------- Landscape phones: put card + actions side by side ---------- */
  @media (max-height: 480px) and (min-width: 640px){
    .page{
      flex-direction: row;
      justify-content:center;
      align-items:center;
      gap: clamp(20px, 4vw, 40px);
      padding: 16px calc(24px + env(safe-area-inset-right)) 16px calc(24px + env(safe-area-inset-left));
    }
    .eyebrow{ display:none; }
    .stage{ width: min(46vw, calc(78vh * 1.75), 420px); }
    .actions{ width: min(280px, 34vw); }
    .footnote{ display:none; }
  }

  @media (min-width: 860px){
    .stage, .actions{ width: 480px; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="eyebrow"><span class="dot"></span> Tap the card to flip</div>

  <div class="stage" id="stage">
    <div class="card" id="card">
      <div class="face front">
        <div class="flip-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.7V12a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 11.3v.7a9 9 0 0 1-9 9 9 9 0 0 1-6-2.3"/></svg>
          tap to flip
        </div>
      </div>
      <div class="face back"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-secondary" id="saveBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      Save Contact
    </button>

    <a class="btn btn-secondary" href="tel:+18333250830">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Call
    </a>

    <a class="btn btn-ghost" href="mailto:jorges@novixone.co">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
      Email
    </a>

    <a class="btn btn-ghost" href="https://novixone.co" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Website
    </a>

    <button class="btn btn-quiet full" id="shareBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
      Share Card
    </button>

    <button class="btn btn-text full" id="copyBtn">Copy link to paste anywhere</button>
  </div>

  <p class="footnote">Add this page to your home screen for one-tap access — Share → "Add to Home Screen".</p>

</div>

<div class="toast" id="toast"></div>

<script>
  const stage = document.getElementById('stage');
  const shareBtn = document.getElementById('shareBtn');
  const saveBtn = document.getElementById('saveBtn');
  const copyBtn = document.getElementById('copyBtn');
  const toastEl = document.getElementById('toast');

  stage.addEventListener('click', () => stage.classList.toggle('flipped'));

  function showToast(msg, ms=2600){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toastEl.classList.remove('show'), ms);
  }

  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Socorro;Jorge;;;",
    "FN:Jorge Socorro",
    "ORG:Novix One",
    "TITLE:Founder & AI Consultant",
    "TEL;TYPE=WORK,VOICE:833-325-0830",
    "EMAIL;TYPE=WORK:jorges@novixone.co",
    "URL:https://novixone.co",
    "ADR;TYPE=WORK:;;;Miami;FL;;USA",
    "END:VCARD"
  ].join("\r\n");

  function vcardBlob(){
    return new Blob([vcard], { type: "text/vcard" });
  }

  saveBtn.addEventListener('click', () => {
    const blob = vcardBlob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = "Jorge_Socorro_NovixOne.vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    showToast("Contact card downloading — open it to save to Contacts");
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      showToast("Link copied — paste it into WhatsApp, SMS, or email");
    } catch (err) {
      showToast(location.href);
    }
  });

  shareBtn.addEventListener('click', async () => {
    const shareData = {
      title: "Jorge Socorro — Novix One",
      text: "Jorge Socorro, Founder & AI Consultant at Novix One",
      url: location.href
    };

    try {
      if (navigator.share) {
        await navigator.share(shareData);
        return;
      }
      throw new Error("no-share-api");
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(shareData.url);
        showToast("Sharing isn't available here — link copied instead");
      } else {
        showToast("Open this page on a phone browser to share via WhatsApp/Messages");
      }
    }
  });
</script>

</body>
</html>
