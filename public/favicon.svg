<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="brightGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background for maximum contrast against any background -->

  <!-- N - Bright cyan/turquoise for maximum contrast -->
  <g filter="url(#brightGlow)">
    <!-- Left vertical bar -->
    <polygon points="20,34 32,34 32,80 20,88" fill="#00d9ff" stroke="#00ffff" stroke-width="1"/>

    <!-- Diagonal bar -->
    <polygon points="32,34 80,94 68,94 20,34" fill="#00d9ff" stroke="#00ffff" stroke-width="1"/>

    <!-- Right vertical bar -->
    <polygon points="68,94 80,86 80,34 68,34" fill="#00d9ff" stroke="#00ffff" stroke-width="1"/>
  </g>

  <!-- 1 - Bright lime/electric green for contrast -->
  <g filter="url(#brightGlow)">
    <!-- Main vertical stroke -->
    <rect x="88" y="28" width="12" height="70" fill="#00ff41" stroke="#33ff66" stroke-width="1" rx="1"/>

    <!-- Top serif -->
    <polygon points="80,28 104,28 92,14" fill="#00ff41" stroke="#33ff66" stroke-width="1"/>

    <!-- Bottom serif -->
    <polygon points="82,98 106,98 94,110" fill="#00ff41" stroke="#33ff66" stroke-width="1"/>
  </g>
</svg>