<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="128" height="128" fill="#0a0e1a" rx="16"/>

  <!-- Dark Navy N with 3D depth -->
  <g>
    <!-- Left vertical bar -->
    <polygon points="24,32 32,32 32,80 24,88" fill="#1a2847"/>
    <polygon points="32,32 32,80 40,88 40,40" fill="#2a3857"/>

    <!-- Diagonal bar -->
    <polygon points="40,40 80,96 72,96 32,40" fill="#1a2847"/>
    <polygon points="32,40 32,48 80,104 88,104 88,96 40,40" fill="#2a3857"/>

    <!-- Right vertical bar -->
    <polygon points="72,96 80,88 80,40 72,32" fill="#1a2847"/>
    <polygon points="80,88 80,40 88,32 88,96" fill="#2a3857"/>
  </g>

  <!-- Bright Blue 1 -->
  <g>
    <!-- Main vertical stroke -->
    <polygon points="96,32 104,32 104,96 96,96" fill="#2563eb"/>

    <!-- Top serif/arrow -->
    <polygon points="88,32 104,32 96,22" fill="#2563eb"/>

    <!-- Right edge for depth -->
    <polygon points="104,32 112,32 112,96 104,96" fill="#1e3a8a"/>
  </g>
</svg>