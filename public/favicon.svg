<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="nGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="oneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Subtle background for depth -->
  <rect width="128" height="128" fill="#0f172a" rx="16"/>

  <!-- N with bright blue gradient and glow -->
  <g filter="url(#glow)">
    <!-- Left vertical bar -->
    <polygon points="20,36 30,36 30,78 20,86" fill="url(#nGradient)" stroke="#60a5fa" stroke-width="0.5"/>

    <!-- Diagonal bar -->
    <polygon points="30,36 78,92 68,92 20,36" fill="url(#nGradient)" stroke="#60a5fa" stroke-width="0.5"/>

    <!-- Right vertical bar -->
    <polygon points="68,92 78,84 78,36 68,36" fill="url(#nGradient)" stroke="#60a5fa" stroke-width="0.5"/>
  </g>

  <!-- Bright Blue 1 with gradient and glow -->
  <g filter="url(#glow)">
    <!-- Main vertical stroke -->
    <rect x="88" y="30" width="10" height="66" fill="url(#oneGradient)" stroke="#93c5fd" stroke-width="0.5" rx="1"/>

    <!-- Top serif/arrow -->
    <polygon points="82,30 98,30 90,20" fill="url(#oneGradient)" stroke="#93c5fd" stroke-width="0.5"/>

    <!-- Bottom serif -->
    <polygon points="85,96 101,96 93,103" fill="url(#oneGradient)" stroke="#93c5fd" stroke-width="0.5"/>
  </g>
</svg>